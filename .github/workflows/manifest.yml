name: Vokabellisten prüfen

on:
  push:
    branches: [main]
    paths: ["listen/**", "scripts/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Listen prüfen und manifest.json erzeugen
        run: python3 scripts/build_manifest.py
      - name: manifest.json committen
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- manifest.json && git ls-files --error-unmatch manifest.json >/dev/null 2>&1; then
            echo "manifest.json unverändert"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "manifest.json aktualisiert"
          git push
